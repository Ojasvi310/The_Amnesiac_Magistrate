name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-local:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-online.txt
        pip install pytest
    - name: Run local tests
      run: |
        # GPU/Colab-only tests (marked @pytest.mark.colab_only) are excluded from CI. 
        # GitHub Actions runners have no GPU. See scripts/run_colab_tests.sh for running these inside a Colab session.
        pytest -m "not colab_only" -v tests/

  smoke-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run smoke test
      run: bash scripts/smoke_test_no_network.sh

  import-graph-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check prohibited imports
      run: |
        if grep -r "import requests\|import httpx\|import torch\|import peft\|import bitsandbytes\|from transformers import" src/online/; then
          echo "Found prohibited imports in src/online/"
          exit 1
        else
          echo "Import graph check passed."
          exit 0
        fi
